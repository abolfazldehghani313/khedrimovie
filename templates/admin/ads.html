{% extends 'admin/layout.html' %}{% block admin_content %}<div class="admin-head"><div><h1>تبلیغات</h1><p>مدیریت بنر و ویدئوی تبلیغاتی</p></div></div><section class="form-page"><form method="post" class="admin-form"><div class="form-grid"><label>عنوان<input name="title" required></label><label>محل نمایش<input name="placement" value="صفحه اصلی"></label></div><label>فایل یا آدرس رسانه<input name="media_url"></label><label>آدرس مقصد<input name="target_url"></label><label><input type="checkbox" name="is_active" checked> فعال</label><button class="btn btn-primary">افزودن تبلیغ</button></form></section><section class="admin-table-card"><table><tr><th>عنوان</th><th>محل</th><th>فعال</th><th>رسانه</th></tr>{% for a in items %}<tr><td>{{a.title}}</td><td>{{a.placement}}</td><td>{{'بله' if a.is_active else 'خیر'}}</td><td>{{a.media_url or '-'}}</td></tr>{% endfor %}</table></section>{% endblock %}
