{% extends 'admin/layout.html' %}{% block admin_content %}<div class="admin-head"><div><h1>کاربران</h1><p>حساب‌ها و نقش‌های سیستم</p></div></div><section class="admin-table-card"><div class="table-wrap"><table><tr><th>نام</th><th>ایمیل</th><th>موبایل</th><th>نقش</th><th>ثبت‌نام</th></tr>{% for u in items %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.phone or '-'}}</td><td>{{'مدیر' if u.is_admin else 'کاربر'}}</td><td>{{u.created_at.strftime('%Y/%m/%d')}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
