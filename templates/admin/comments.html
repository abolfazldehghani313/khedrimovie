{% extends 'admin/layout.html' %}{% block admin_content %}<div class="admin-head"><div><h1>نظرات</h1><p>بررسی و مدیریت نظرات کاربران</p></div></div><section class="admin-table-card"><table><tr><th>کاربر</th><th>محتوا</th><th>نظر</th><th>وضعیت</th><th>تاریخ</th></tr>{% for c in items %}<tr><td>{{c.user.name}}</td><td>{{c.content.title}}</td><td>{{c.body}}</td><td>{{c.status}}</td><td>{{c.created_at.strftime('%Y/%m/%d')}}</td></tr>{% endfor %}</table></section>{% endblock %}
